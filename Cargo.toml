[package]
name = "model"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }

# `supabase` feature only — keeps the HTTP stack out of data-only consumers.
anyhow = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[features]
supabase = ["dep:anyhow", "dep:reqwest"]

[dev-dependencies]
serde_json = "1"
